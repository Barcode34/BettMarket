<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BettMarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: ticket-style sticky header, then league rail | fixtures or match page | bet slip. Phone: rail becomes a chip scroller, slip becomes a bottom sheet. */
:root{
  --bg:#E6EDEA; --surface:#F6F9F8; --surface2:#DCE6E2; --ink:#0F2019; --muted:#53655D; --line:#C3D1CA;
  --brand:#0A6B45; --brand-ink:#FFFFFF; --pick:#F2C230; --pick-ink:#1B1500;
  --win:#0A7A44; --lose:#B33A2C; --shadow:0 6px 24px rgba(15,32,25,.14);
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A171B; --surface:#112228; --surface2:#183039; --ink:#E5F0EC; --muted:#8FA8A0; --line:#244048;
    --brand:#33B27F; --brand-ink:#04140D; --pick:#F2C230; --pick-ink:#1B1500;
    --win:#3ED08A; --lose:#FF8576; --shadow:0 6px 24px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A171B; --surface:#112228; --surface2:#183039; --ink:#E5F0EC; --muted:#8FA8A0; --line:#244048;
  --brand:#33B27F; --brand-ink:#04140D; --pick:#F2C230; --pick-ink:#1B1500;
  --win:#3ED08A; --lose:#FF8576; --shadow:0 6px 24px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pick);outline-offset:2px}
h1,h2,h3,p{margin:0}

.strip{background:var(--ink);color:var(--bg);font-size:12px;text-align:center;padding:6px 16px}
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.hin{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;cursor:pointer}
.lg-mark{width:26px;height:18px;border-radius:3px;background:
  radial-gradient(circle at 0 50%,var(--surface) 3.2px,transparent 3.7px),
  radial-gradient(circle at 100% 50%,var(--surface) 3.2px,transparent 3.7px),var(--pick)}
.lg-txt{font:800 28px/1 var(--f-display);letter-spacing:.01em}
.lg-txt b{color:var(--brand);font-weight:800}
.hnav{display:flex;gap:4px}
.hnav button{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.hnav button.on{color:var(--ink);background:var(--surface2)}
.hr{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bal{display:flex;flex-direction:column;line-height:1.1;text-align:right}
.bal small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bal b{font:600 17px var(--f-mono)}
.who{font-weight:600;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang{display:flex;background:var(--surface2);border-radius:6px;padding:2px;gap:2px}
.lang button{border:0;background:none;padding:5px 9px;border-radius:5px;font:600 12px var(--f-mono);cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--surface);color:var(--ink)}

.btn{font-weight:600;font-size:13px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);cursor:pointer}
.btn:hover{border-color:var(--brand)}
.btn.brand{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pick{background:var(--pick);color:var(--pick-ink);border-color:var(--pick)}
.btn.ghost{background:none}
.btn.big{padding:12px 18px;font-size:15px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

.wrap{max-width:1320px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:210px minmax(0,1fr) 320px;align-items:start}
#rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 90px);overflow-y:auto}
.gt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 4px;padding-inline:10px}
.chip{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:6px;padding:7px 10px;cursor:pointer}
.chip:hover{background:var(--surface2)}
.chip.on{background:var(--brand);color:var(--brand-ink);font-weight:600}
.chip i{font:500 12px var(--f-mono);font-style:normal;opacity:.7}
#main{min-width:0;display:flex;flex-direction:column;gap:16px}

.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-h h2{font:800 24px/1.1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.sec-h span{color:var(--muted);font-size:13px}
.lg-block{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lg-h{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;background:var(--surface2);font-weight:600;font-size:13px}
.lg-h small{color:var(--muted);font-weight:400}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) 200px 44px;align-items:center;gap:8px 10px;padding:10px 14px;border-top:1px solid var(--line)}
.rtime{font:600 13px var(--f-mono);color:var(--muted);background:none;border:0;padding:0;text-align:left;cursor:pointer}
.rtime.live{color:var(--lose)}
.rteams{display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;padding:0;cursor:pointer;min-width:0}
.rteams span{display:flex;justify-content:space-between;gap:8px;min-width:0}
.rteams em{font:600 14px var(--f-mono);font-style:normal}
.rodds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rmore{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 0;font:600 12px var(--f-mono);color:var(--muted);cursor:pointer}
.rmore:hover{border-color:var(--brand);color:var(--ink)}

.odd{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);cursor:pointer;text-align:left}
.odd:hover:not(:disabled){border-color:var(--brand)}
.odd .ol{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.odd .ov{font:600 14px var(--f-mono)}
.odd.on{background:var(--pick);border-color:var(--pick);color:var(--pick-ink)}
.odd.on .ol{color:inherit}
.odd:disabled{opacity:.45;cursor:not-allowed}
.rodds .odd{flex-direction:column;align-items:center;gap:1px;padding:6px 4px}

.feat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;border-left:6px solid var(--pick)}
.feat .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.vs .tm{font:800 clamp(24px,4.2vw,40px)/1 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere}
.vs .tm:last-child{text-align:right}
.vs .mid{font:600 20px var(--f-mono);text-align:center;color:var(--muted)}
.feat-odds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.feat-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{color:var(--muted);font-size:12.5px}

.sb{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.sb-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.sb-grid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px}
.sb-grid .tm{font:800 clamp(22px,4vw,38px)/1.05 var(--f-display);text-transform:uppercase;overflow-wrap:anywhere}
.sb-grid .tm:last-child{text-align:right}
#score{display:flex;flex-direction:column;align-items:center;min-width:110px;gap:2px}
#score b{font:700 44px/1 var(--f-mono)}
#score .clock{font:600 30px/1 var(--f-mono)}
#score .sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
#score .sub.live{color:var(--lose);font-weight:600}
#evs{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 12.5px var(--f-mono);color:var(--muted);min-height:0}
#evs span b{color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--pick)}
.mkt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.mkt h3{font-size:13px;font-weight:600}
.mgrid{display:grid;gap:8px}
.mgrid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.mgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.mlist{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.mkt.wide{grid-column:1/-1}
.lock{background:var(--surface2);border-radius:8px;padding:10px 14px;font-size:13px}

#slip{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 90px)}
.slip-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.slip-h h2{font:800 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.cnt{background:var(--pick);color:var(--pick-ink);font:600 12px var(--f-mono);border-radius:999px;padding:2px 8px}
.slip-h .x{margin-left:auto;display:none;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted)}
.slip-b{padding:12px 14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:8px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:7px;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.sel{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.sel:first-child{border-top:0}
.sel b{font-size:13.5px}
.sel small{grid-column:1;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.sel .o{font:600 14px var(--f-mono);grid-row:1;grid-column:2}
.sel .rm{grid-row:1;grid-column:3;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
.stake{display:flex;flex-direction:column;gap:6px}
.stake label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stake .in{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding-left:10px;font:600 15px var(--f-mono)}
.stake input{flex:1;min-width:0;border:0;background:none;color:var(--ink);padding:10px;font:inherit;outline:none}
.stake .in:focus-within{border-color:var(--pick)}
.qs{display:flex;gap:6px;flex-wrap:wrap}
.qs button{flex:1;min-width:48px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px;font:600 12.5px var(--f-mono);cursor:pointer}
.tot{display:flex;flex-direction:column;gap:4px;font-size:13px}
.tot div{display:flex;justify-content:space-between;gap:8px}
.tot b{font-family:var(--f-mono)}
.tot .big{font-size:15px;padding-top:6px;border-top:1px dashed var(--line)}
.empty{color:var(--muted);padding:6px 0}
#slipbar{display:none}

.bet{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;border-left:5px solid var(--line)}
.bet.won{border-left-color:var(--win)}.bet.lost{border-left-color:var(--lose)}.bet.pending{border-left-color:var(--pick)}
.bet header{display:flex;gap:10px;align-items:center;padding:9px 14px;background:var(--surface2);font-size:13px;flex-wrap:wrap}
.bet header time{margin-left:auto;color:var(--muted);font:500 12px var(--f-mono)}
.pill{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;border:1px solid currentColor}
.pill.won{color:var(--win)}.pill.lost{color:var(--lose)}.pill.pending{color:var(--muted)}
.leg{display:grid;grid-template-columns:minmax(0,1fr) auto 12px;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.leg small{display:block;color:var(--muted);font-size:12px}
.leg .o{font:600 13px var(--f-mono)}
.dt{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dt.won{background:var(--win)}.dt.lost{background:var(--lose)}
.bet footer{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:13px}
.bet footer b{font-family:var(--f-mono)}
.blist{display:flex;flex-direction:column;gap:12px}

#modal{position:fixed;inset:0;z-index:60;background:rgba(5,12,10,.62);display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:400px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;max-height:100%;overflow-y:auto}
.card h2{font:800 26px/1 var(--f-display);text-transform:uppercase}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld input{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px;border-radius:6px;font:inherit}
.fld input:focus{outline:2px solid var(--pick);outline-offset:0}
.err{color:var(--lose);font-size:13px}
.hintbox{background:var(--surface2);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.foot{max-width:1320px;margin:0 auto;padding:8px 16px 28px;color:var(--muted);font-size:12.5px}

@media (max-width:1040px){
  .wrap{grid-template-columns:minmax(0,1fr);padding-bottom:96px}
  #rail{position:static;flex-direction:row;overflow-x:auto;max-height:none;gap:6px;padding-bottom:4px}
  #rail .gt{display:none}
  .chip{white-space:nowrap;border:1px solid var(--line);flex:none;gap:10px}
  #slip{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:50;border-radius:14px 14px 0 0;max-height:82%;transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:var(--shadow);visibility:hidden}
  #slip.open{transform:none;visibility:visible}
  .slip-h .x{display:block}
  #slipbar.show{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;justify-content:space-between;align-items:center;gap:10px;background:var(--pick);color:var(--pick-ink);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border:0;font-weight:600;cursor:pointer;width:100%}
  #slipbar b{font-family:var(--f-mono)}
  .mlist{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .row{grid-template-columns:52px minmax(0,1fr) 40px;grid-template-areas:"t n m" "o o o"}
  .rtime{grid-area:t}.rteams{grid-area:n}.rodds{grid-area:o}.rmore{grid-area:m}
  .vs .tm,.sb-grid .tm{font-size:22px}
  #score b{font-size:34px}
  #score{min-width:84px}
  .mgrid.c3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hr{margin-left:0;width:100%;justify-content:space-between}
}
@media (prefers-reduced-motion:no-preference){
  #slip{transition:transform .22s ease,visibility .22s}
}

:root{--paper:#F1F2E8;--paper-ink:#16221B;--paper-mute:#667269;--paper-line:#B7BDB0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#DDE2D6;--paper-ink:#121A16;--paper-mute:#586259;--paper-line:#A2AA9E}}
:root[data-theme="dark"]{--paper:#DDE2D6;--paper-ink:#121A16;--paper-mute:#586259;--paper-line:#A2AA9E}
.ctry{display:flex;flex-direction:column;gap:2px}
.ctry-b{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;text-align:left;font-weight:600}
.ctry-b:hover,.ctry-b.on{background:var(--surface2)}
.ctry-b i{margin-left:auto;font:500 12px var(--f-mono);font-style:normal;opacity:.7}
.car{width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;flex:none}
.ctry.open .car{transform:rotate(45deg)}
.ctry-l{display:none;flex-direction:column;gap:2px;padding-left:20px}
.ctry.open .ctry-l{display:flex}
.fl{width:22px;height:15px;border-radius:2px;flex:none;box-shadow:0 0 0 1px var(--line);display:block}
.cal{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.day{flex:none;min-width:66px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.day small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.day b{font:700 20px/1.1 var(--f-display)}
.day.today:not(.on){border-color:var(--brand)}
.day.on{background:var(--pick);border-color:var(--pick);color:var(--pick-ink)}
.day.on small{color:inherit}
.tklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:26px 18px;padding-block:8px}
.tk{background:var(--paper);color:var(--paper-ink);font:12.5px/1.4 var(--f-mono);padding:16px 16px 14px;position:relative;display:flex;flex-direction:column;gap:10px;min-width:0}
.tk::before,.tk::after{content:"";position:absolute;left:0;right:0;height:8px}
.tk::before{top:-8px;background:radial-gradient(circle at 6px 8px,var(--paper) 6px,transparent 6.5px) 0 0/12px 8px repeat-x}
.tk::after{bottom:-8px;background:radial-gradient(circle at 6px 0,var(--paper) 6px,transparent 6.5px) 0 0/12px 8px repeat-x}
.tk-h{text-align:center;display:flex;flex-direction:column;gap:2px;padding-bottom:10px;border-bottom:1px dashed var(--paper-line)}
.tk-b{font:800 32px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.tk-m{color:var(--paper-mute);font-size:11.5px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tk-leg{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;padding-bottom:8px;border-bottom:1px dotted var(--paper-line)}
.tk-leg b{font-weight:600}
.tk-leg small{grid-column:1/-1;color:var(--paper-mute);font-size:11.5px;overflow-wrap:anywhere}
.tk-leg .r{font-weight:600}
.tk-leg .r.won{text-decoration:underline}
.tk-tot{display:flex;flex-direction:column;gap:3px}
.tk-tot div{display:flex;justify-content:space-between;gap:8px}
.tk-tot .big{font-weight:600;font-size:14px;padding-top:4px;border-top:1px dashed var(--paper-line)}
.tk-st{align-self:center;border:2px solid currentColor;border-radius:4px;padding:2px 12px;font:800 20px/1.1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;transform:rotate(-4deg)}
.tk-st.won{color:#0A6B35}.tk-st.lost{color:#A8321F}.tk-st.pending{color:var(--paper-mute)}
.bc{width:100%;height:42px;display:block;color:var(--paper-ink)}

function calc(){
 const n=S.sel.length,st=r2(Math.max(0,parseFloat(S.stake)||0));
 const canAcca=n>1&&new Set(S.sel.map(s=>s.mid)).size===n;
 if(S.mode==='acca'&&!canAcca)S.mode='single';
 if(S.mode==='acca'){const o=S.sel.reduce((p,s)=>p*s.odds,1);return{n,st,canAcca,stake:st,ret:st*o,odds:o}}
 return{n,st,canAcca,stake:st*n,ret:S.sel.reduce((p,s)=>p+s.odds*st,0),odds:null};
}
function pick(mid,oid){
 const m=MB[mid];if(locked(m))return;
 const i=S.sel.findIndex(s=>s.mid===mid&&s.oid===oid);
 if(i>=0){S.sel.splice(i,1)}
 else{
  const mkid=oid.split(':')[0],o=optInfo(mid,oid).o;
  S.sel=S.sel.filter(s=>!(s.mid===mid&&s.oid.split(':')[0]===mkid));
  S.sel.push({mid,oid,odds:o.odds});
 }
 renderMain();renderSlip();
}
function uid(){return 'B'+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*46656).toString(36).toUpperCase()}
async function place(){
 const u=cu();if(!u){openAuth();return}
 const c=calc();if(!c.n)return;
 if(c.st<1)return toast(t('min_stake'));
 if(c.stake>u.balance+1e-9)return toast(t('no_funds'));
 if(S.sel.some(s=>locked(MB[s.mid]))){S.sel=S.sel.filter(s=>!locked(MB[s.mid]));renderMain();renderSlip();return toast(t('e_closed'))}
 const legs=S.sel.map(s=>({mid:s.mid,oid:s.oid,odds:s.odds,res:null})),id=uid();
 const b=S.mode==='acca'
  ?{id,type:'acca',legs,stake:c.st,odds:r2(c.odds)}
  :{id,type:legs.length>1?'multi':'single',legs,stake:r2(c.st*legs.length),unit:c.st,odds:legs.length===1?legs[0].odds:0};
 Object.assign(b,{user:S.sess,uname:u.name,ts:Date.now(),status:'pending',paid:0});
 BETS[id]=b;u.balance=r2(u.balance-b.stake);
 const ret=c.ret;S.sel=[];S.slipOpen=false;
 saveLocal();renderAll();toast(t('placed',gbp(ret)));
 if(await putUser(S.sess))await putBet(id);
}
let settling=false;
async function settleMine(){
 const u=cu();if(!u||settling)return;
 settling=true;
 try{
  const dirty=[];let won=0,lost=0;
  for(const b of Object.values(BETS)){
   if(b.user!==S.sess||b.status!=='pending')continue;
   let touched=false;const unit=b.unit||b.stake;
   for(const l of b.legs){
    if(l.res)continue;const m=MB[l.mid];if(!m)continue;
    const r=resOf(m);if(!r)continue;
    const inf=optInfo(l.mid,l.oid);if(!inf.o)continue;
    l.res=(inf.mk.half&&r.h1==null)?'void':(inf.o.t(r)?'won':'lost');touched=true;
    if(b.type!=='acca'){
     if(l.res==='won'){const x=r2(unit*l.odds);u.balance=r2(u.balance+x);b.paid=r2((b.paid||0)+x)}
     else if(l.res==='void'){u.balance=r2(u.balance+unit);b.paid=r2((b.paid||0)+unit)}
    }
   }
   if(!touched)continue;
   const L=b.legs;
   if(b.type==='acca'){
    if(L.some(l=>l.res==='lost'))b.status='lost';
    else if(L.every(l=>l.res)){
     const ok=L.filter(l=>l.res==='won');
     if(!ok.length){b.status='void';b.paid=b.stake}
     else{b.odds=r2(ok.reduce((p,l)=>p*l.odds,1));b.paid=r2(b.stake*b.odds);b.status='won'}
     u.balance=r2(u.balance+b.paid);
    }
   }else if(L.every(l=>l.res)){
    b.status=L.some(l=>l.res==='won')?'won':(L.every(l=>l.res==='void')?'void':'lost');
   }
   if(b.status==='won')won++;else if(b.status==='lost')lost++;
   dirty.push(b.id);
  }
  if(dirty.length){
   USERS[S.sess]=u;saveLocal();renderAll();
   if(await putUser(S.sess))for(const id of dirty)await putBet(id);
   toast(t('settled',won,lost));
  }
 }finally{settling=false}
}

/* ---------- admin test simulation ---------- */
function sample(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function paint(m,goal){
 if(S.view==='match'&&S.mid===m.id){const a=$('#score'),b=$('#evs');if(a)a.innerHTML=scoreHTML(m);if(b)b.innerHTML=evHTML(m)}
 if(goal&&S.view==='home')renderMain();
}
function startSim(mid){
 const m=MB[mid];if(!m||!isAdmin()||resOf(m)||LIVE[mid])return;
 const all=[];
 for(const side of ['h','a']){const n=sample(side==='h'?m.lh:m.la);for(let i=0;i<n;i++){const first=Math.random()<.45;all.push({min:first?1+Math.floor(Math.random()*45):46+Math.floor(Math.random()*45),side})}}
 all.sort((x,y)=>x.min-y.min);
 const L={min:0,h:0,a:0,pause:0,phase:'',ev:[],all};LIVE[mid]=L;
 S.sel=S.sel.filter(s=>s.mid!==mid);
 renderAll();
 const timer=setInterval(async()=>{
  if(L.pause>0){L.pause--;L.phase='HT';paint(m,false);return}
  L.phase='';L.min++;let goal=false;
  for(const e of L.all)if(e.min===L.min){L.ev.push(e);e.side==='h'?L.h++:L.a++;goal=true}
  if(L.min===45)L.pause=12;
  if(L.min>=90){
   clearInterval(timer);
   delete LIVE[mid];
   if(REAL[mid]){renderAll();return}
   RES[mid]={h:L.h,a:L.a,h1:L.all.filter(e=>e.side==='h'&&e.min<=45).length,a1:L.all.filter(e=>e.side==='a'&&e.min<=45).length,ev:L.all};
   saveLocal();renderAll();
   toast(t('final',m.home,L.h,L.a,m.away));
   await putRes(mid);settleMine();
   return;
  }
  paint(m,goal);
 },55);
}

/* ---------- tickets ---------- */
function bars(id){
 let a=5381;for(let i=0;i<id.length;i++)a=((a*33)^id.charCodeAt(i))>>>0;
 const r=rng(a),out=[];let x=0;
 while(x<200){const w=1+Math.floor(r()*3);out.push([x,w]);x+=w+1+Math.floor(r()*2)}
 return out;
}
function barSVG(id){
 const b=bars(id),W=b[b.length-1][0]+b[b.length-1][1];
 return `<svg viewBox="0 0 ${W} 30" preserveAspectRatio="none" aria-hidden="true">${b.map(p=>`<rect x="${p[0]}" width="${p[1]}" height="30" fill="currentColor"/>`).join('')}</svg>`;
}
function legInfo(l){
 const m=MB[l.mid];
 if(!m)return{sel:l.oid,mt:'',nm:'—',odds:l.odds,res:l.res};
 const inf=optInfo(l.mid,l.oid);
 return{sel:inf.o?inf.o.l:l.oid,mt:inf.mk?inf.mk.title:'',nm:m.home+' - '+m.away,odds:l.odds,res:l.res};
}
function tkTotals(b){
 const unit=b.unit||b.stake,n=b.legs.length;
 let label,ret;
 if(b.type==='acca')label=[t('acca',n),t('odds')+' '+b.odds.toFixed(2)];
 else if(b.type==='multi')label=[t('single_n',n,gbp(unit)),''];
 else label=[t('single'),t('odds')+' '+b.legs[0].odds.toFixed(2)];
 if(b.status==='pending'){
  ret=b.type==='acca'?b.stake*b.odds:b.legs.reduce((p,l)=>p+(l.res==='lost'?0:unit*l.odds),0);
 }else ret=b.paid||0;
 const rl=b.status==='won'?t('won_l'):b.status==='lost'?t('ret_l'):b.status==='void'?t('st_void'):t('ret_poss');
 return{label,ret,rl};
}

 const T=tkTotals(b);

  ${legs}
  <div class="tk-sum"><div><span>${esc(T.label[0])}</span><b>${esc(T.label[1])}</b></div>
   <div><span>${t('stake')}</span><b>${gbp(b.stake)}</b></div>
   <div><span>${T.rl}</span><b>${gbp(T.ret)}</b></div></div>
  ${b.status!=='pending'?`<div class="tk-stamp ${b.status}">${t('st_'+b.status)}</div>`:''}

}
async function ticketPNG(b){
 try{await document.fonts.load('800 40px "Big Shoulders Display"');await document.fonts.load('600 14px "IBM Plex Mono"')}catch(e){}
 const W=640,pad=34,legs=b.legs.map(legInfo),T=tkTotals(b),stamp=b.status!=='pending';
 const H=pad+104+legs.length*66+12+84+6+(stamp?64:0)+56+pad,sc=2;
 const cv=document.createElement('canvas');cv.width=W*sc;cv.height=H*sc;
 const g=cv.getContext('2d');g.scale(sc,sc);
 const MONO='"IBM Plex Mono",ui-monospace,monospace',DISP='"Big Shoulders Display","Arial Narrow",Impact,sans-serif';
 const fit=(s,w)=>{if(g.measureText(s).width<=w)return s;while(s.length>1&&g.measureText(s+'…').width>w)s=s.slice(0,-1);return s+'…'};
 g.fillStyle='#FAF8F1';g.fillRect(0,0,W,H);
 g.fillStyle='#1A1A16';g.textBaseline='alphabetic';
 g.font='800 44px '+DISP;g.textAlign='left';g.fillText('BETTMARKET',pad,pad+38);
 g.font='600 14px '+MONO;g.textAlign='right';g.fillText('#'+b.id,W-pad,pad+36);
 g.fillRect(pad,pad+52,W-2*pad,2);
 g.font='500 12px '+MONO;g.fillStyle='#6A685D';g.textAlign='left';
 g.fillText(new Date(b.ts).toLocaleString(LOCALE(),{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),pad,pad+78);
 g.textAlign='right';g.fillText(t('tk_by')+': '+(b.uname||b.user),W-pad,pad+78);
 let y=pad+104;
 legs.forEach(i=>{
  g.strokeStyle='#CFCABA';g.setLineDash([4,4]);g.beginPath();g.moveTo(pad,y-14);g.lineTo(W-pad,y-14);g.stroke();g.setLineDash([]);
  g.textAlign='left';g.fillStyle='#1A1A16';g.font='600 16px '+MONO;g.fillText(fit(i.sel,W-2*pad-90),pad,y+6);
  g.textAlign='right';g.fillText(i.odds.toFixed(2),W-pad,y+6);
  g.textAlign='left';g.fillStyle='#6A685D';g.font='500 12px '+MONO;g.fillText(fit(i.mt,W-2*pad-90),pad,y+26);g.fillText(fit(i.nm,W-2*pad-90),pad,y+43);
  if(i.res){g.textAlign='right';g.font='600 12px '+MONO;g.fillStyle=i.res==='won'?'#0A7A44':i.res==='lost'?'#B33A2C':'#6A685D';g.fillText(t('st_'+i.res).toUpperCase(),W-pad,y+26)}
  y+=66;
 });
 g.fillStyle='#1A1A16';g.fillRect(pad,y-12,W-2*pad,2);
 const line=(a,v)=>{g.textAlign='left';g.font='500 14px '+MONO;g.fillStyle='#1A1A16';g.fillText(a,pad,y+14);g.textAlign='right';g.font='600 15px '+MONO;g.fillText(v,W-pad,y+14);y+=28};
 line(T.label[0],T.label[1]);
 line(t('stake'),gbp(b.stake));
 line(T.rl,gbp(T.ret));
 y+=6;
 if(stamp){
  const col=b.status==='won'?'#0A7A44':b.status==='lost'?'#B33A2C':'#6A685D',tx=t('st_'+b.status).toUpperCase();
  g.save();g.translate(W/2,y+22);g.rotate(-0.07);g.strokeStyle=col;g.fillStyle=col;g.lineWidth=3;
  g.font='800 30px '+DISP;g.textAlign='center';const tw=g.measureText(tx).width;
  g.strokeRect(-tw/2-16,-26,tw+32,44);g.fillText(tx,0,6);g.restore();
  y+=64;
 }
 const bb=bars(b.id),bw=bb[bb.length-1][0]+bb[bb.length-1][1],k=(W-2*pad)/bw;
 g.fillStyle='#1A1A16';bb.forEach(p=>g.fillRect(pad+p[0]*k,y,p[1]*k,56));
 return new Promise(res=>cv.toBlob(res,'image/png'));
}

/* ---------- bet slip ---------- */
function updTotals(){const c=calc();const a=$('#t-stake'),b=$('#t-ret');if(a)a.textContent=gbp(c.stake);if(b)b.textContent=gbp(c.ret)}
function renderSlip(){
 const c=calc(),u=cu();
 let b;
 if(!c.n)b=`<p class="empty">${t('slip_empty')}</p>`;
 else b=`<div class="seg"><button class="${S.mode==='single'?'on':''}" data-act="mode" data-v="single">${t('singles')}</button><button class="${S.mode==='acca'?'on':''}" data-act="mode" data-v="acca"${c.canAcca?'':' disabled'}>${t('accas')}</button></div>
  ${c.n>1&&!c.canAcca?`<p class="note">${t('acca_need')}</p>`:''}
  <div>${S.sel.map((s,i)=>{const inf=optInfo(s.mid,s.oid),m=MB[s.mid];return `<div class="sel"><b>${esc(inf.o.l)}</b><span class="o">${s.odds.toFixed(2)}</span><button class="rm" data-act="rm" data-i="${i}" aria-label="×">×</button><small>${esc(inf.mk.title)} · ${esc(m.home+' - '+m.away)}</small></div>`}).join('')}</div>
  <div class="stake"><label for="stake">${S.mode==='acca'?t('stake_one'):t('stake_each')}</label><div class="in">£<input id="stake" type="number" inputmode="decimal" min="1" step="1" value="${esc(S.stake)}"></div>
  <div class="qs">${[10,50,100,500,1000].map(v=>`<button data-act="qs" data-v="${v}">£${v}</button>`).join('')}</div></div>
  <div class="tot">${S.mode==='acca'?`<div><span>${t('t_odds')}</span><b>${c.odds.toFixed(2)}</b></div>`:''}<div><span>${t('t_stake')}</span><b id="t-stake">${gbp(c.stake)}</b></div><div class="big"><span>${t('t_ret')}</span><b id="t-ret">${gbp(c.ret)}</b></div></div>
  <button class="btn brand big full" data-act="place">${u?t('place'):t('place_login')}</button>
  ${u?`<p class="note">${t('balance')} ${gbp(u.balance)}</p>`:''}`;
 $('#slip').innerHTML=`<div class="slip-h"><h2>${t('slip_t')}</h2><span class="cnt">${c.n}</span><button class="x" data-act="slipclose" aria-label="×">×</button></div><div class="slip-b">${b}</div>`;
 $('#slip').classList.toggle('open',S.slipOpen&&c.n>0);
 const bar=$('#slipbar');bar.classList.toggle('show',c.n>0&&!S.slipOpen);
 bar.innerHTML=`<span>${t('slip_t')} (${c.n})</span><b>${gbp(c.ret)}</b>`;
}

/* ---------- modal: login, theme, ticket image ---------- */
function renderModal(){
 const el=$('#modal');
 if(S.dlg){
  el.hidden=false;
  if(S.dlg.type==='theme'){
   const th=[['auto','th_auto'],['light','th_light'],['dark','th_dark']],ac=[['green','ac_green'],['orange','ac_orange'],['blue','ac_blue'],['brown','ac_brown']];
   el.innerHTML=`<div data-act="closemodal" style="position:absolute;inset:0"></div><div class="card" style="position:relative"><h2>${t('theme_t')}</h2>
    <div class="seg">${th.map(x=>`<button class="${THEME===x[0]?'on':''}" data-act="setmode" data-v="${x[0]}">${t(x[1])}</button>`).join('')}</div>
    <h3 class="sub-h">${t('th_color')}</h3>
    <div class="swatches">${ac.map(x=>`<button class="sw sw-${x[0]}${ACCENT===x[0]?' on':''}" data-act="setaccent" data-v="${x[0]}"><i></i>${t(x[1])}</button>`).join('')}</div>
    <button class="btn ghost" data-act="closemodal">OK</button></div>`;
  }else{
   el.innerHTML=`<div data-act="closemodal" style="position:absolute;inset:0"></div><div class="card" style="position:relative"><h2>BettMarket</h2>
    <img class="tkimg" src="${S.dlg.url}" alt="ticket"><p class="note">${t('img_hint')}</p>
    <a class="btn brand" href="${S.dlg.url}" download="${esc(S.dlg.name)}">${t('dl')}</a><button class="btn ghost" data-act="closemodal">OK</button></div>`;
  }
  return;
 }
 if(!S.auth){el.hidden=true;el.innerHTML='';return}
 const fixed=S.last&&!S.auth.change,setup=!Object.keys(USERS).some(k=>k===ADMIN);
 el.hidden=false;
 el.innerHTML=`<div data-act="closemodal" style="position:absolute;inset:0"></div><form class="card" id="authform" style="position:relative" novalidate>
  <h2>${t('a_login')}</h2>
  ${fixed?`<div class="hintbox">${t('login_as','<b>'+esc(S.last)+'</b>')}</div>`:''}
  <div class="err" id="au-err"></div>
  ${fixed?'':`<div class="fld"><label for="au-user">${t('a_user')}</label><input id="au-user" autocomplete="username" maxlength="20" autocapitalize="off"></div>`}
  <div class="fld"><label for="au-pass">${t('a_pass')}</label><input id="au-pass" type="password" autocomplete="current-password"></div>
  ${setup?`<div class="hintbox">${t('a_setup')}</div>`:`<div class="hintbox">${t('a_nores')}</div>`}
  <button class="btn brand big" type="submit">${t('a_enter')}</button>
  ${fixed?`<button class="btn ghost" type="button" data-act="changeuser">${t('a_change')}</button>`:''}</form>`;
}
function renderAll(){applyTheme();renderChrome();renderHeader();renderRail();renderMain();renderSide();renderSlip();renderModal()}

/* ---------- events ---------- */
const top0=()=>window.scrollTo(0,0);
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act;
 if(a==='closemodal'&&e.target!==b)return;
 switch(a){
  case 'home':S.view='home';S.mid=null;S.editOdds=false;renderAll();top0();break;
  case 'bets':S.view='bets';renderAll();top0();break;
  case 'admin':S.view='admin';renderAll();top0();break;
  case 'day':S.day=b.dataset.d==='all'?null:b.dataset.d;S.view='home';renderAll();break;
  case 'league':S.league=b.dataset.k;if(b.dataset.k!=='all')S.day=null;S.view='home';renderAll();break;
  case 'country':{const c=b.dataset.k;
   if(S.open[c]){S.open[c]=false;if(S.league==='c:'+c||LG[S.league]&&LG[S.league].c===c)S.league='all'}
   else{S.open[c]=true;S.league='c:'+c;S.day=null}
   S.view='home';renderAll();break}
  case 'open':S.view='match';S.mid=b.dataset.m;S.tab='main';S.editOdds=false;renderAll();top0();break;
  case 'tab':S.tab=b.dataset.t;renderMain();break;
  case 'pick':pick(b.dataset.m,b.dataset.o);break;
  case 'rm':S.sel.splice(+b.dataset.i,1);renderMain();renderSlip();break;
  case 'mode':S.mode=b.dataset.v;renderSlip();break;
  case 'qs':S.stake=b.dataset.v;renderSlip();break;
  case 'place':place();break;
  case 'sim':startSim(b.dataset.m);break;
  case 'slipopen':S.slipOpen=true;renderSlip();break;
  case 'slipclose':S.slipOpen=false;renderSlip();break;
  case 'lang':LANG=b.dataset.v;sv('bm_lang',LANG);renderAll();break;
  case 'theme':S.dlg={type:'theme'};renderModal();break;
  case 'setmode':THEME=b.dataset.v;sv('bm_theme',THEME);applyTheme();renderModal();break;
  case 'setaccent':ACCENT=b.dataset.v;sv('bm_accent',ACCENT);applyTheme();renderModal();break;
  case 'login':openAuth(false);break;
  case 'changeuser':openAuth(true);break;
  case 'closemodal':closeModal();break;
  case 'logout':logout();break;
  case 'createuser':createUser(b.dataset.p);break;
  case 'xfer':transfer(b.dataset.p);break;
  case 'savematch':saveMatch();break;
  case 'editodds':S.editOdds=!S.editOdds;renderMain();break;
  case 'saveodds':saveOdds(false);break;
  case 'resetodds':saveOdds(true);break;
  case 'dl':dlTicket(b.dataset.b);break;
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='stake'){S.stake=e.target.value;updTotals()}
 if(e.target.dataset&&e.target.dataset.oid){e.target.classList.toggle('chg',Math.abs(parseFloat(e.target.value)-parseFloat(e.target.dataset.base))>1e-9)}
});
document.addEventListener('submit',e=>{if(e.target.id==='authform'){e.preventDefault();doAuth()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.auth||S.dlg))closeModal()});

/* ---------- start ---------- */
$('#railbox').open=window.innerWidth>1040;
renderAll();
setInterval(()=>{if(!S.auth&&!S.dlg)softRender();settleMine()},60000);
(async function connect(){
 if(!(window.claude&&claude.use))return;
 try{DL=await claude.use('downloads')}catch(e){}
 try{UC=await claude.use('user')}catch(e){}
 try{DB=await claude.use('db')}catch(e){DB=null}
 try{ROOM=await claude.use('room')}catch(e){ROOM=null}
 if(DB){
  USERS={};BETS={};RES={};OVR={};REAL={};
  const sub=(col,fn)=>DB.collection(col).onSnapshot(snap=>{fn(snap);softRender();settleMine()},()=>{});
  const fill=(o,s)=>{for(const k in o)delete o[k];s.docs.forEach(d=>{o[d.id]=clone(d.data())})};
  sub('users',s=>{const keep=cu()&&USERS[S.sess];fill(USERS,s);if(S.sess&&!USERS[S.sess]&&keep&&false)USERS[S.sess]=keep});
  sub('bets',s=>fill(BETS,s));
  sub('results',s=>fill(RES,s));
  sub('real',s=>fill(REAL,s));
  sub('ovr',s=>{fill(OVR,s);MATCHES.forEach(applyOvr)});
 }
 if(ROOM){ROOM.onPeers(()=>{if(isAdmin())softRender()},()=>{});setPresence()}
 renderAll();
})();


})();</script>
</body>
</html>
